name: Django checks

on:
  push:
    paths:
      - "Application/**"
      - ".github/workflows/django.yml"
  pull_request:
    paths:
      - "Application/**"
      - ".github/workflows/django.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Application/requirements.txt
      - name: Install application dependencies
        run: python -m pip install -r Application/requirements.txt
      - name: Check Django configuration
        run: python Application/manage.py check
      - name: Check migration consistency
        run: python Application/manage.py makemigrations --check --dry-run
      - name: Run tests
        run: python Application/manage.py test inventory
